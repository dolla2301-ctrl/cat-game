<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Добрячки</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040218;
        }

        body {
            line-height: 1;
            font-family: Arial, sans-serif;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        ol, ul {
            list-style: none;
        }

        img, video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .hidden-counter {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div class="hidden-counter">
        <a href="https://hits.sh/dolla2301-ctrl.github.io/cat-game/">
            <img alt="Hits" src="https://hits.sh/dolla2301-ctrl.github.io/cat-game.svg"/>
        </a>
    </div>

    <!-- Firebase -->

        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getDatabase } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAXwTzC0sMcozw8gI3YXCAyntLe12I1Tw",
            authDomain: "cat-game-4c85e.firebaseapp.com",
            databaseURL: "https://cat-game-4c85e-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cat-game-4c85e",
            storageBucket: "cat-game-4c85e.firebasestorage.app",
            messagingSenderId: "2527921324",
            appId: "1:2527921324:web:2bde3bf3cc7b91533f0b09"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
    </script>

    <script src="./phaser.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
