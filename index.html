<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Добрячки</title>
    <style>
        /* Reset CSS */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040218;
        }

        body {
            line-height: 1;
            font-family: Arial, sans-serif;
        }

        /* Контейнер игры на весь экран */
        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        /* Канвас не должен скроллить страницу при касаниях */
        canvas {
            display: block;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        ol, ul {
            list-style: none;
        }

        img, video {
            max-width: 100%;
            height: auto;
            display: block;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Счётчик скрыт от игроков, но работает */
        .hidden-counter {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- Счётчик посещений: считает всех, но НЕ виден на странице -->
    <div class="hidden-counter">
        <a href="https://hits.sh/dolla2301-ctrl.github.io/cat-game/">
            <img alt="Hits" src="https://hits.sh/dolla2301-ctrl.github.io/cat-game.svg"/>
        </a>
    </div>

    <script src="./phaser.js"></script>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
